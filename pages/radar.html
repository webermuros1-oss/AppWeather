<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Radar - PlusWeather</title>

    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        base-uri 'self';
        object-src 'none';
        script-src 'self' https://cdnjs.cloudflare.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com;
        font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:;
        img-src 'self' data: https:;
        connect-src 'self' https://api.open-meteo.com https://geocoding-api.open-meteo.com https://marine-api.open-meteo.com https://air-quality-api.open-meteo.com https://nominatim.openstreetmap.org https://api.bigdatacloud.net https://api.rainviewer.com;
        manifest-src 'self';
        worker-src 'self';
    " />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <link rel="stylesheet" href="../css/radar.css" />
    <link rel="stylesheet" href="../css/header.css" />
    <link rel="stylesheet" href="../css/footer.css" />
    <link rel="manifest" href="../json/manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="icon" type="image/png" href="../media/images/logoRemaster.png">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
          integrity="sha384-iw3OoTErCYJJB9mCa8LNS2hbsQ7M3C0EpIsO/H5+EGAkPGc6rk+V8i04oW/K5xq0"
          crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
          integrity="sha384-c6Rcwz4e4CITMbu/NBmnNS8yN2sC3cUElMEMfP3vqqKFp7GOYaaBBCqmaWBjmkjb"
          crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <header-plus-weather></header-plus-weather>

    <div class="pageTitle">
        <h2><i class="fa-solid fa-satellite-dish"></i> <span data-i18n="radarTitle">Radar de Precipitaciones</span></h2>
        <p data-i18n="radarSubtitle">Visualización en tiempo real de lluvias y tormentas · Se actualiza cada 10 minutos</p>
    </div>

    <div class="radarContainer">
        <div class="radarCard">
            <div id="radarMap"></div>
            <div class="radarControls">
                <div class="radarLegend">
                    <span class="legendLabel" data-i18n="radarWeakRain">Lluvia débil</span>
                    <div class="legendBar"></div>
                    <span class="legendLabel" data-i18n="radarHeavy">Intensa</span>
                </div>
                <div class="opacityControl">
                    <i class="fa-solid fa-eye" style="color:var(--accent-teal)"></i>
                    <span data-i18n="radarOpacity">Opacidad</span>
                    <input type="range" id="opacitySlider" min="0" max="100" value="80">
                </div>
                <div class="radarTimestamp">
                    <i class="fa-solid fa-clock"></i>
                    <span id="radarTime" data-i18n="radarLoading">Cargando...</span>
                </div>
            </div>
        </div>

        <div class="radarInfoCards">
            <div class="radarInfoCard">
                <i class="fa-solid fa-satellite-dish"></i>
                <h4 data-i18n="radarSource">Fuente</h4>
                <p>RainViewer</p>
            </div>
            <div class="radarInfoCard">
                <i class="fa-solid fa-rotate"></i>
                <h4 data-i18n="radarUpdate">Actualización</h4>
                <p data-i18n="radarUpdateVal">Cada 10 min</p>
            </div>
            <div class="radarInfoCard">
                <i class="fa-solid fa-globe"></i>
                <h4 data-i18n="radarCoverage">Cobertura</h4>
                <p data-i18n="radarCoverageVal">Global</p>
            </div>
            <div class="radarInfoCard">
                <i class="fa-solid fa-layer-group"></i>
                <h4 data-i18n="radarLayer">Capa activa</h4>
                <p data-i18n="radarLayerVal">Precipitación</p>
            </div>
        </div>
    </div>

    <footer-plus-weather></footer-plus-weather>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"
            integrity="sha384-NElt3Op+9NBMCYaef5HxeJmU4Xeard/Lku8ek6hoPTvYkQPh3zLIrJP7KiRocsxO"
            crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script type="module" src="../src/pages/radar-page.js"></script>
</body>
</html>
