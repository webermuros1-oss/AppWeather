<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Radar - PlusWeather</title>

    <link rel="stylesheet" href="../css/radar.css" />
    <link rel="stylesheet" href="../css/header.css" />
    <link rel="stylesheet" href="../css/footer.css" />
    <link rel="manifest" href="../json/manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="icon" type="image/png" href="../media/images/logoRemaster.png">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
</head>
<body>
    <header-plus-weather></header-plus-weather>

    <div class="pageTitle">
        <h2><i class="fa-solid fa-satellite-dish"></i> <span data-i18n="radarTitle">Radar de Precipitaciones</span></h2>
        <p data-i18n="radarSubtitle">Visualización en tiempo real de lluvias y tormentas · Se actualiza cada 10 minutos</p>
    </div>

    <div class="radarContainer">
        <div class="radarCard">
            <div id="radarMap"></div>
            <div class="radarControls">
                <div class="radarLegend">
                    <span class="legendLabel" data-i18n="radarWeakRain">Lluvia débil</span>
                    <div class="legendBar"></div>
                    <span class="legendLabel" data-i18n="radarHeavy">Intensa</span>
                </div>
                <div class="opacityControl">
                    <i class="fa-solid fa-eye" style="color:var(--accent-teal)"></i>
                    <span data-i18n="radarOpacity">Opacidad</span>
                    <input type="range" id="opacitySlider" min="0" max="100" value="80">
                </div>
                <div class="radarTimestamp">
                    <i class="fa-solid fa-clock"></i>
                    <span id="radarTime" data-i18n="radarLoading">Cargando...</span>
                </div>
            </div>
        </div>

        <div class="radarInfoCards">
            <div class="radarInfoCard">
                <i class="fa-solid fa-satellite-dish"></i>
                <h4 data-i18n="radarSource">Fuente</h4>
                <p>RainViewer</p>
            </div>
            <div class="radarInfoCard">
                <i class="fa-solid fa-rotate"></i>
                <h4 data-i18n="radarUpdate">Actualización</h4>
                <p data-i18n="radarUpdateVal">Cada 10 min</p>
            </div>
            <div class="radarInfoCard">
                <i class="fa-solid fa-globe"></i>
                <h4 data-i18n="radarCoverage">Cobertura</h4>
                <p data-i18n="radarCoverageVal">Global</p>
            </div>
            <div class="radarInfoCard">
                <i class="fa-solid fa-layer-group"></i>
                <h4 data-i18n="radarLayer">Capa activa</h4>
                <p data-i18n="radarLayerVal">Precipitación</p>
            </div>
        </div>
    </div>

    <footer-plus-weather></footer-plus-weather>

    <script src="../js/i18n.js"></script>
    <script src="../js/header.js"></script>
    <script src="../js/footer.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script>
        const map = L.map("radarMap", {
            center: [40.4, -3.7],
            zoom: 6,
            zoomControl: true,
            attributionControl: true
        });

        L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
            attribution: '© OpenStreetMap © CARTO',
            subdomains: "abcd",
            maxZoom: 19
        }).addTo(map);

        let radarLayer = null;
        let currentOpacity = 0.8;

        async function loadRadar() {
            try {
                const res  = await fetch("https://api.rainviewer.com/public/weather-maps.json");
                const data = await res.json();
                if (!data.radar?.past?.length) return;

                const latestFrame = data.radar.past[data.radar.past.length - 1];
                const radarUrl = `https://tilecache.rainviewer.com${latestFrame.path}/256/{z}/{x}/{y}/2/1_1.png`;

                if (radarLayer) map.removeLayer(radarLayer);
                radarLayer = L.tileLayer(radarUrl, { opacity: currentOpacity, attribution: "RainViewer" }).addTo(map);

                const ts = new Date(latestFrame.time * 1000);
                const lang = window.I18N ? I18N.lang : "es";
                document.getElementById("radarTime").textContent =
                    `${window.I18N ? I18N.t("radarUpdated") : "Actualizado:"} ${ts.toLocaleTimeString(lang, { hour: "2-digit", minute: "2-digit" })}`;
            } catch {
                document.getElementById("radarTime").textContent = window.I18N ? I18N.t("radarError") : "Error al cargar el radar";
            }
        }

        document.getElementById("opacitySlider").addEventListener("input", (e) => {
            currentOpacity = e.target.value / 100;
            if (radarLayer) radarLayer.setOpacity(currentOpacity);
        });

        // Centrar en GPS al cargar
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => map.setView([pos.coords.latitude, pos.coords.longitude], 8),
                () => {},
                { timeout: 5000 }
            );
        }

        // Centrar en la ciudad buscada desde el header
        document.addEventListener("citySelected", (e) => {
            const { latitude, longitude, name } = e.detail;
            map.setView([latitude, longitude], 8, { animate: true });

            // Marcador temporal que desaparece al mover el mapa
            const marker = L.marker([latitude, longitude])
                .addTo(map)
                .bindPopup(`<b>${name}</b>`)
                .openPopup();

            map.once("movestart", () => map.removeLayer(marker));
        });

        document.addEventListener("langChanged", () => {
            document.querySelectorAll("[data-i18n]").forEach(el => {
                if (el.id === "radarTime") return;
                el.textContent = I18N.t(el.getAttribute("data-i18n"));
            });
        });

        loadRadar();
        setInterval(loadRadar, 600000);
    </script>
</body>
</html>
