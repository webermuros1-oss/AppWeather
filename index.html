<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlusWeather</title>

    <!-- Seguridad: política de contenido. Limita orígenes de scripts, estilos,
         conexiones (solo las APIs gratuitas usadas) e imágenes. -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        base-uri 'self';
        object-src 'none';
        script-src 'self' https://cdnjs.cloudflare.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com;
        font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:;
        img-src 'self' data: https:;
        connect-src 'self' https://api.open-meteo.com https://geocoding-api.open-meteo.com https://marine-api.open-meteo.com https://air-quality-api.open-meteo.com https://nominatim.openstreetmap.org https://api.bigdatacloud.net https://api.rainviewer.com;
        manifest-src 'self';
        worker-src 'self';
    " />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <link rel="stylesheet" href="css/index.css" />
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/footer.css" />

    <link rel="manifest" href="json/manifest.json">
    <meta name="theme-color" content="#0f172a">

    <link rel="icon" type="image/png" sizes="32x32"  href="media/images/logoRemaster.png">
    <link rel="icon" type="image/png" sizes="192x192" href="media/images/logoRemaster192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="media/images/logoRemaster512.png">
    <link rel="apple-touch-icon" href="media/images/logoRemaster192.png">

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
          integrity="sha384-iw3OoTErCYJJB9mCa8LNS2hbsQ7M3C0EpIsO/H5+EGAkPGc6rk+V8i04oW/K5xq0"
          crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

    <header-plus-weather></header-plus-weather>

    <main class="dashboard">

        <div class="card mainWeatherCard">
            <button class="navArrow prevArrow">❮</button>
            <button class="navArrow nextArrow">❯</button>
            <div class="locationInfo">
                <h2 class="cityName">Ciudad</h2>
                <p class="date">Fecha</p>
            </div>
            <div class="currentWeather">
                <div class="weatherIconDisplay">🌤️</div>
                <div class="tempInfo">
                    <h1 class="weatherDeg">--°C</h1>
                    <p class="weatherCondition">Cargando...</p>
                </div>
            </div>
            <div class="favDots" id="favDots"></div>
        </div>


        <div class="card hourlyCard" id="hourlyCard">
            <h4>
                🕒 Próximas 24 horas
                <i class="fa-solid fa-chevron-down card-toggle-icon"></i>
            </h4>
            <div class="card-body">
                <div class="hourlyInfo"></div>
            </div>
        </div>


        <div class="card forecastCard" id="forecastCard">
            <h4>
                📅 Pronóstico 7 días
                <i class="fa-solid fa-chevron-down card-toggle-icon"></i>
            </h4>
            <div class="card-body">
                <div class="forecastInfo"></div>
            </div>
        </div>


        <div class="card atmosphereCard" id="atmosphereCard">
            <h4>
                ☁️ Condiciones atmosféricas
                <i class="fa-solid fa-chevron-down card-toggle-icon"></i>
            </h4>
            <div class="card-body">
                <div class="gridInfo atmosphereInfo"></div>
            </div>
        </div>


        <div class="card windCard">
            <h4>
                💨 Viento
                <i class="fa-solid fa-chevron-down card-toggle-icon"></i>
            </h4>
            <div class="card-body">
                <div class="windInfo"></div>
                <div class="analytics-cta">
                    <a href="pages/charts.html" class="analytics-btn">
                        <i class="fa-solid fa-chart-line"></i>
                        Ver gráficas detalladas
                    </a>
                </div>
            </div>
        </div>


        <div class="card astroCard">
            <h4>
                🌅 Datos astronómicos
                <i class="fa-solid fa-chevron-down card-toggle-icon"></i>
            </h4>
            <div class="card-body">
                <div class="astroInfo"></div>
            </div>
        </div>


        <div class="card marineCard" id="marineCard">
            <h4>
                🌊 Datos marítimos
                <i class="fa-solid fa-chevron-down card-toggle-icon"></i>
            </h4>
            <div class="card-body">
                <div class="marineInfo"></div>
                <div class="analytics-cta">
                    <a href="pages/charts.html#marineCard" class="analytics-btn">
                        <i class="fa-solid fa-water"></i>
                        Ver gráficas marítimas
                    </a>
                </div>
            </div>
        </div>

    </main>

    <footer-plus-weather></footer-plus-weather>

    <script type="module" src="src/main.js"></script>
</body>
</html>
